<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">GhostAP — Feishu-Native AI Engineering Control Plane</title>
  <desc id="hero-desc">Hero banner showcasing GhostAP capabilities: 9+2 AI coding backends, Direct/Deep/Spec/Teamwork /wf engines, Card JSON 2.0 cockpits, and Outbound WebSocket under 60 MiB RSS.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1c"/>
      <stop offset="52%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="glowRight" cx="85%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="14%" cy="84%" r="44%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="emblemStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="ghostBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="apGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#818cf8" stroke-width="0.7" stroke-opacity="0.09"/>
    </pattern>
    <clipPath id="heroClip">
      <rect x="0" y="0" width="1280" height="380" rx="22"/>
    </clipPath>
    <style>
      .sans { font-family: 'Inter', 'SF Pro Display', 'Noto Sans CJK SC', 'PingFang SC', 'Segoe UI', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', 'Noto Sans Mono CJK SC', monospace; }
    </style>
  </defs>

  <g clip-path="url(#heroClip)">
    <!-- Backdrop & atmospheric glows -->
    <rect x="0" y="0" width="1280" height="380" rx="22" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1280" height="380" fill="url(#gridPattern)"/>
    <rect x="0" y="0" width="1280" height="380" fill="url(#glowRight)"/>
    <rect x="0" y="0" width="1280" height="380" fill="url(#glowLeft)"/>

    <!-- Subtle geometric orbital arcs in background -->
    <circle cx="1110" cy="145" r="210" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.09" stroke-dasharray="6 8"/>
    <circle cx="1110" cy="145" r="290" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.07"/>

    <!-- Sleek GhostAP Emblem -->
    <g transform="translate(64, 52)">
      <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#emblemBg)" stroke="url(#emblemStroke)" stroke-width="2"/>
      <!-- Orbital node ring -->
      <ellipse cx="48" cy="48" rx="37" ry="18" transform="rotate(-24 48 48)" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.45"/>
      <circle cx="80" cy="34" r="3.5" fill="#38bdf8"/>
      <!-- Stylized GhostAP silhouette -->
      <path d="M 48 20 C 33 20 24 31 24 46 L 24 72 C 24 74.5 27 76 29 74 L 35.5 68.5 C 37 67.2 39 67.2 40.5 68.5 L 45.5 73 C 47 74.3 49 74.3 50.5 73 L 55.5 68.5 C 57 67.2 59 67.2 60.5 68.5 L 67 74 C 69 76 72 74.5 72 72 L 72 46 C 72 31 63 20 48 20 Z" fill="url(#ghostBody)"/>
      <!-- Glowing gateway visor / eyes -->
      <rect x="33" y="38" width="30" height="14" rx="7" fill="#0f172a" fill-opacity="0.88"/>
      <circle cx="41.5" cy="45" r="3.2" fill="#38bdf8"/>
      <circle cx="54.5" cy="45" r="3.2" fill="#38bdf8"/>
      <!-- Control-plane crest dot -->
      <circle cx="48" cy="14" r="3" fill="#818cf8"/>
    </g>

    <!-- Eyebrow pill + GhostAP Wordmark -->
    <g transform="translate(182, 54)">
      <rect x="0" y="0" width="286" height="24" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="14" cy="12" r="4" fill="#34d399"/>
      <text x="26" y="16" class="mono" font-size="11" font-weight="600" fill="#bae6fd" letter-spacing="0.06em">FEISHU / LARK CONTROL PLANE</text>

      <text x="0" y="84" class="sans" font-size="56" font-weight="800" letter-spacing="-0.025em" fill="#f8fafc">Ghost<tspan fill="url(#apGrad)">AP</tspan></text>
    </g>

    <!-- Bilingual Tagline -->
    <text x="64" y="194" class="sans" font-size="19.5" font-weight="600" fill="#e2e8f0">飞书/Lark 原生多工具 AI 研发控制面与多智能体执行网关</text>
    <text x="64" y="224" class="sans" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.01em">Feishu-Native AI Engineering Control Plane</text>

    <!-- Right-side Control Plane Telemetry Panel -->
    <g transform="translate(894, 46)">
      <rect x="0" y="0" width="322" height="190" rx="16" fill="#0b1224" fill-opacity="0.82" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="322" height="34" rx="16" fill="#131e38"/>
      <rect x="0" y="18" width="322" height="16" fill="#131e38"/>
      <line x1="0" y1="34" x2="322" y2="34" stroke="#1e293b" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#ef4444" fill-opacity="0.75"/>
      <circle cx="32" cy="17" r="4" fill="#f59e0b" fill-opacity="0.75"/>
      <circle cx="46" cy="17" r="4" fill="#10b981" fill-opacity="0.75"/>
      <text x="64" y="21" class="mono" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.06em">GATEWAY RUNTIME SNAPSHOT</text>

      <g transform="translate(18, 52)">
        <circle cx="6" cy="6" r="4" fill="#34d399"/>
        <text x="18" y="10" class="mono" font-size="12" fill="#cbd5e1">Ingress</text>
        <text x="286" y="10" class="mono" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="end">Outbound WS · Zero Webhook</text>
      </g>
      <g transform="translate(18, 84)">
        <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
        <text x="18" y="10" class="mono" font-size="12" fill="#cbd5e1">Backends</text>
        <text x="286" y="10" class="mono" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="end">9 ACP/CLI + 2 Gateways</text>
      </g>
      <g transform="translate(18, 116)">
        <circle cx="6" cy="6" r="4" fill="#a78bfa"/>
        <text x="18" y="10" class="mono" font-size="12" fill="#cbd5e1">Strategies</text>
        <text x="286" y="10" class="mono" font-size="12" font-weight="600" fill="#c4b5fd" text-anchor="end">Direct · Deep · Spec · /wf</text>
      </g>
      <g transform="translate(18, 148)">
        <circle cx="6" cy="6" r="4" fill="#fbbf24"/>
        <text x="18" y="10" class="mono" font-size="12" fill="#cbd5e1">Memory</text>
        <text x="286" y="10" class="mono" font-size="12" font-weight="600" fill="#fde68a" text-anchor="end">&lt;60 MiB Lazy RSS · 23 Slash</text>
      </g>
    </g>

    <!-- Subtle horizontal divider -->
    <line x1="64" y1="258" x2="1216" y2="258" stroke="#94a3b8" stroke-opacity="0.16" stroke-width="1"/>

    <!-- 4 Crisp Capability Pills -->
    <!-- Pill 1 -->
    <g transform="translate(64, 282)">
      <rect x="0" y="0" width="256" height="52" rx="13" fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <rect x="12" y="13" width="26" height="26" rx="8" fill="#0284c7" fill-opacity="0.25"/>
      <path d="M 20 22 L 24 26 L 20 30 M 26 30 L 31 30" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="31" class="sans" font-size="14" font-weight="600" fill="#f1f5f9">9+2 AI Coding Backends</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(338, 282)">
      <rect x="0" y="0" width="342" height="52" rx="13" fill="#0f172a" fill-opacity="0.88" stroke="#818cf8" stroke-opacity="0.45" stroke-width="1.2"/>
      <rect x="12" y="13" width="26" height="26" rx="8" fill="#4f46e5" fill-opacity="0.28"/>
      <circle cx="20" cy="21" r="2.2" fill="#a5b4fc"/>
      <circle cx="30" cy="21" r="2.2" fill="#a5b4fc"/>
      <circle cx="25" cy="31" r="2.2" fill="#a5b4fc"/>
      <path d="M 20 21 L 30 21 L 25 31 Z" fill="none" stroke="#818cf8" stroke-width="1.3"/>
      <text x="48" y="31" class="sans" font-size="14" font-weight="600" fill="#f1f5f9">Direct · Deep · Spec · Teamwork /wf</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(698, 282)">
      <rect x="0" y="0" width="244" height="52" rx="13" fill="#0f172a" fill-opacity="0.88" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2"/>
      <rect x="12" y="13" width="26" height="26" rx="8" fill="#059669" fill-opacity="0.25"/>
      <rect x="18" y="19" width="14" height="14" rx="2.5" fill="none" stroke="#34d399" stroke-width="1.7"/>
      <line x1="18" y1="24" x2="32" y2="24" stroke="#34d399" stroke-width="1.5"/>
      <text x="48" y="31" class="sans" font-size="14" font-weight="600" fill="#f1f5f9">Card JSON 2.0 Cockpits</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(960, 282)">
      <rect x="0" y="0" width="256" height="52" rx="13" fill="#0f172a" fill-opacity="0.88" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.2"/>
      <rect x="12" y="13" width="26" height="26" rx="8" fill="#d97706" fill-opacity="0.24"/>
      <path d="M 26 18 L 20 27 L 25 27 L 24 34 L 30 25 L 25 25 Z" fill="#fbbf24"/>
      <text x="48" y="31" class="sans" font-size="14" font-weight="600" fill="#f1f5f9">Outbound WS · &lt;60 MiB RSS</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="378.5" rx="21.25" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
</svg>
