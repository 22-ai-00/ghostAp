[project]
name = "ghostap"
version = "0.2.1"
description = "飞书原生 Agent Department 控制面与研发执行网关"
requires-python = ">=3.11"
dependencies = [
    "lark-oapi==1.7.1",
    "agent-client-protocol>=0.11.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "psutil>=7.2.2",
    "lark-channel-sdk==1.1.0",
    "cryptography==49.0.0",
]

[dependency-groups]
dev = [
    "interrogate>=1.7.0",
    "mypy>=1.19.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
timeout = 30
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that exercise integration-style infrastructure",
]
filterwarnings = [
    "ignore::DeprecationWarning:lark_oapi.*",
    "ignore::DeprecationWarning:websockets.*",
    "once:.*is deprecated.*:DeprecationWarning:src\\.card\\.",
    "once:.*is deprecated.*:DeprecationWarning:tests\\.",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py", "tests/*"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "scripts/archive",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501", # keep line-length enforcement in formatter (ruff format); do not fail lint
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E402", # tests often group imports near scenario-specific sections
    "E702", # concurrent race tests keep paired thread operations visually adjacent
    "E741", # legacy tests use short comprehension names
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semimajor = false
ignore-private = true
ignore-property-decorators = true
ignore-nested-functions = true
ignore-setters = true
fail-under = 80
exclude = [
    "setup.py",
    "docs",
    "tests",
    "scripts",
    # 聚焦核心流转模块：调度 / 模式 / WS 路由
    "src/agent_session.py",
    "src/config.py",
    "src/main.py",
    "src/acp",
    "src/agent",
    "src/card",
    "src/coco_model",
    "src/deep_engine",
    "src/project",
    "src/sandbox",
    "src/spec_engine",
    "src/utils",
    # feishu 子模块暂不纳入 docstring 覆盖率（保留 ws_client.py）
    "src/feishu/handlers",
    "src/feishu/renderers",
    "src/feishu/action_dispatcher.py",
    "src/feishu/emoji.py",
    "src/feishu/handler_context.py",
    "src/feishu/im_client.py",
    "src/feishu/image_handler.py",
    "src/feishu/message_cache.py",
    "src/feishu/message_formatter.py",
]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 1
quiet = false
whitelist-regex = []
color = true
