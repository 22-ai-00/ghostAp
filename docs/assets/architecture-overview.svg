<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">GhostAP 4-Layer Architecture Overview</title>
  <desc id="arch-desc">Four-layer architecture diagram: Feishu/Lark Workspace, GhostAP Control Plane, 4 Orthogonal Execution Strategies, and Unified Agent Session and Host Layer.</desc>
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#7c3aed"/>
    </marker>
    <style>
      .sans { font-family: 'Inter', 'SF Pro Display', 'Noto Sans CJK SC', 'PingFang SC', 'Segoe UI', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', 'Noto Sans Mono CJK SC', monospace; }
    </style>
  </defs>

  <!-- Self-contained light canvas for consistent readability on GitHub Light & Dark themes -->
  <rect x="0" y="0" width="1200" height="620" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="618" rx="17" fill="url(#dotGrid)" fill-opacity="0.65"/>

  <!-- Diagram Header -->
  <g transform="translate(36, 20)">
    <text x="0" y="20" class="sans" font-size="18" font-weight="800" fill="#0f172a">GhostAP 4-Layer Architecture · 四层系统架构总览</text>
    <rect x="818" y="1" width="310" height="26" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="973" y="18" class="mono" font-size="11" font-weight="600" fill="#3730a3" text-anchor="middle">Orthogonal Engines · Outbound WS · Zero Webhook</text>
  </g>

  <!-- LAYER 1: Feishu / Lark Workspace -->
  <g transform="translate(36, 60)">
    <rect x="0" y="0" width="1128" height="98" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="98" rx="4" fill="#0284c7"/>
    <text x="24" y="25" class="sans" font-size="13.5" font-weight="700" fill="#0369a1">LAYER 1 · FEISHU / LARK WORKSPACE</text>
    <text x="316" y="25" class="sans" font-size="13" font-weight="600" fill="#475569">飞书 / Lark 交互工作区与入口事件</text>
    <rect x="938" y="8" width="174" height="22" rx="11" fill="#e0f2fe"/>
    <text x="1025" y="23" class="mono" font-size="10.5" font-weight="600" fill="#0369a1" text-anchor="middle">PC 7.70+ · Mobile 7.71+</text>

    <!-- 5 Layer 1 nodes -->
    <g transform="translate(22, 40)">
      <rect x="0" y="0" width="204" height="44" rx="9" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="102" y="18" class="sans" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">P2P Direct Chat</text>
      <text x="102" y="34" class="sans" font-size="11" fill="#475569" text-anchor="middle">私聊直控 · /setadmin 引导</text>
    </g>
    <g transform="translate(242, 40)">
      <rect x="0" y="0" width="204" height="44" rx="9" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="102" y="18" class="sans" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Managed Project Groups</text>
      <text x="102" y="34" class="sans" font-size="11" fill="#475569" text-anchor="middle">受管项目群 · 群项目映射</text>
    </g>
    <g transform="translate(462, 40)">
      <rect x="0" y="0" width="204" height="44" rx="9" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="102" y="18" class="sans" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Topic Threads</text>
      <text x="102" y="34" class="sans" font-size="11" fill="#475569" text-anchor="middle">话题根线程隔离长任务</text>
    </g>
    <g transform="translate(682, 40)">
      <rect x="0" y="0" width="204" height="44" rx="9" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="102" y="18" class="sans" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">23-Item Slash Panel</text>
      <text x="102" y="34" class="sans" font-size="11" fill="#475569" text-anchor="middle">product_catalog SSOT 对账</text>
    </g>
    <g transform="translate(902, 40)">
      <rect x="0" y="0" width="210" height="44" rx="9" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="105" y="18" class="sans" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Card JSON 2.0 Callbacks</text>
      <text x="105" y="34" class="sans" font-size="11" fill="#475569" text-anchor="middle">card.action.trigger 回传</text>
    </g>
  </g>

  <!-- Connectors L1 <-> L2 -->
  <g>
    <line x1="390" y1="158" x2="390" y2="188" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
    <rect x="206" y="162" width="174" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="293" y="176" class="mono" font-size="10.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">lark-channel-sdk (WS In)</text>

    <line x1="810" y1="190" x2="810" y2="160" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arrowIndigo)"/>
    <rect x="822" y="162" width="186" height="20" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="915" y="176" class="mono" font-size="10.5" font-weight="600" fill="#4338ca" text-anchor="middle">lark-oapi (Card 2.0 / COT)</text>
  </g>

  <!-- LAYER 2: GhostAP Control Plane -->
  <g transform="translate(36, 190)">
    <rect x="0" y="0" width="1128" height="104" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="104" rx="4" fill="#4f46e5"/>
    <text x="24" y="25" class="sans" font-size="13.5" font-weight="700" fill="#4338ca">LAYER 2 · GHOSTAP CONTROL PLANE</text>
    <text x="328" y="25" class="sans" font-size="13" font-weight="600" fill="#475569">统一研发控制平面（事件校验 · 路由 · 并发锁 · 卡片管线）</text>
    <rect x="944" y="8" width="168" height="22" rx="11" fill="#eef2ff"/>
    <text x="1028" y="23" class="mono" font-size="10.5" font-weight="600" fill="#4338ca" text-anchor="middle">&lt;60 MiB Lazy Runtime</text>

    <g transform="translate(22, 42)">
      <rect x="0" y="0" width="198" height="48" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="99" y="19" class="sans" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Outbound WebSocket</text>
      <text x="99" y="36" class="sans" font-size="11" fill="#475569" text-anchor="middle">零公网暴露 · 长连接保活</text>
    </g>
    <g transform="translate(234, 42)">
      <rect x="0" y="0" width="202" height="48" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="101" y="19" class="sans" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Dedup &amp; Access Control</text>
      <text x="101" y="36" class="sans" font-size="11" fill="#475569" text-anchor="middle">消息去重 · 群/用户双白名单</text>
    </g>
    <g transform="translate(450, 42)">
      <rect x="0" y="0" width="196" height="48" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="98" y="19" class="sans" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Smart Router</text>
      <text x="98" y="36" class="sans" font-size="11" fill="#475569" text-anchor="middle">命令分流 · 原生 / 透传识别</text>
    </g>
    <g transform="translate(660, 42)">
      <rect x="0" y="0" width="196" height="48" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="98" y="19" class="sans" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Chat / Repo Locks</text>
      <text x="98" y="36" class="sans" font-size="11" fill="#475569" text-anchor="middle">LockLevel 锁序防死锁</text>
    </g>
    <g transform="translate(870, 42)">
      <rect x="0" y="0" width="242" height="48" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="121" y="19" class="sans" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Card &amp; COT Pipeline</text>
      <text x="121" y="36" class="mono" font-size="9.8" fill="#4338ca" text-anchor="middle">handler → session → render/delivery</text>
    </g>
  </g>

  <!-- Connectors L2 -> L3 (4 clean vertical arrows aligned to columns) -->
  <g>
    <line x1="170" y1="294" x2="170" y2="322" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowViolet)"/>
    <line x1="457" y1="294" x2="457" y2="322" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowViolet)"/>
    <line x1="743" y1="294" x2="743" y2="322" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowViolet)"/>
    <line x1="1030" y1="294" x2="1030" y2="322" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowViolet)"/>
    <rect x="470" y="298" width="260" height="20" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="600" y="312" class="sans" font-size="10.5" font-weight="600" fill="#5b21b6" text-anchor="middle">正交策略调度 · 与传输协议完全解耦</text>
  </g>

  <!-- LAYER 3: 4 Orthogonal Execution Strategies -->
  <g transform="translate(36, 324)">
    <rect x="0" y="0" width="1128" height="122" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="122" rx="4" fill="#7c3aed"/>
    <text x="24" y="24" class="sans" font-size="13.5" font-weight="700" fill="#6d28d9">LAYER 3 · 4 ORTHOGONAL EXECUTION STRATEGIES</text>
    <text x="412" y="24" class="sans" font-size="13" font-weight="600" fill="#475569">四种正交执行策略（互不覆盖聊天持久编程模式）</text>

    <!-- Strategy 1 -->
    <g transform="translate(22, 36)">
      <rect x="0" y="0" width="256" height="74" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/>
      <text x="14" y="22" class="sans" font-size="13" font-weight="700" fill="#0f172a">1. Direct Programming</text>
      <rect x="176" y="8" width="70" height="18" rx="9" fill="#ede9fe"/>
      <text x="211" y="20" class="mono" font-size="9.8" font-weight="700" fill="#6d28d9" text-anchor="middle">/coco..agy</text>
      <text x="14" y="42" class="sans" font-size="11.5" fill="#475569">普通编程直连 · Sticky Chat+Project</text>
      <text x="14" y="60" class="mono" font-size="10.5" fill="#6d28d9">Multi-turn ACP/CLI · COT + 1 Card</text>
    </g>

    <!-- Strategy 2 -->
    <g transform="translate(298, 36)">
      <rect x="0" y="0" width="256" height="74" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/>
      <text x="14" y="22" class="sans" font-size="13" font-weight="700" fill="#0f172a">2. Deep Engine</text>
      <rect x="198" y="8" width="48" height="18" rx="9" fill="#ede9fe"/>
      <text x="222" y="20" class="mono" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">/deep</text>
      <text x="14" y="42" class="sans" font-size="11.5" fill="#475569">单次规划自主执行 · 话题隔离</text>
      <text x="14" y="60" class="mono" font-size="10.5" fill="#6d28d9">Single-Plan · Auto-Recovery</text>
    </g>

    <!-- Strategy 3 -->
    <g transform="translate(574, 36)">
      <rect x="0" y="0" width="256" height="74" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/>
      <text x="14" y="22" class="sans" font-size="13" font-weight="700" fill="#0f172a">3. Spec Closed-Loop</text>
      <rect x="198" y="8" width="48" height="18" rx="9" fill="#ede9fe"/>
      <text x="222" y="20" class="mono" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">/spec</text>
      <text x="14" y="42" class="sans" font-size="11.5" fill="#475569">多视角审查闭环 · 编程/写作通用</text>
      <text x="14" y="60" class="mono" font-size="10.5" fill="#6d28d9">Spec → Plan → Task → Build → Review</text>
    </g>

    <!-- Strategy 4 -->
    <g transform="translate(850, 36)">
      <rect x="0" y="0" width="262" height="74" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
      <text x="14" y="22" class="sans" font-size="13" font-weight="700" fill="#0f172a">4. Teamwork /wf Engine</text>
      <rect x="206" y="8" width="46" height="18" rx="9" fill="#ccfbf1"/>
      <text x="229" y="20" class="mono" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">/wf</text>
      <text x="14" y="42" class="sans" font-size="11.5" fill="#475569">动态 JS 编排 · 1–8 Pool 冻结执行</text>
      <text x="14" y="60" class="mono" font-size="10.5" fill="#0f766e">agent · fanout · verify · race</text>
    </g>
  </g>

  <!-- Connectors L3 -> L4 -->
  <g>
    <line x1="170" y1="446" x2="170" y2="474" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
    <line x1="457" y1="446" x2="457" y2="474" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
    <line x1="743" y1="446" x2="743" y2="474" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
    <line x1="1030" y1="446" x2="1030" y2="474" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
    <rect x="470" y="450" width="260" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="600" y="464" class="mono" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">ACPSessionManager · Unified ToolSession</text>
  </g>

  <!-- LAYER 4: Unified Agent Session & Host Layer -->
  <g transform="translate(36, 476)">
    <rect x="0" y="0" width="1128" height="126" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="126" rx="4" fill="#059669"/>
    <text x="24" y="24" class="sans" font-size="13.5" font-weight="700" fill="#047857">LAYER 4 · UNIFIED AGENT SESSION &amp; HOST LAYER</text>
    <text x="412" y="24" class="sans" font-size="13" font-weight="600" fill="#475569">统一后端会话、宿主机执行与世代门禁重启</text>

    <!-- Left Subpanel: ACP Stdio & CLI Bridges (9+2) -->
    <g transform="translate(22, 36)">
      <rect x="0" y="0" width="634" height="78" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="14" y="20" class="sans" font-size="12" font-weight="700" fill="#065f46">ACP Stdio &amp; CLI Bridges · 9 Visible + 2 Hidden CLI Gateways</text>

      <!-- Row 1: 9 visible tools -->
      <g transform="translate(14, 28)">
        <rect x="0" y="0" width="60" height="20" rx="6" fill="#ffffff" stroke="#6ee7b7"/><text x="30" y="14" class="mono" font-size="11" font-weight="700" fill="#064e3b" text-anchor="middle">Coco</text>
        <rect x="66" y="0" width="64" height="20" rx="6" fill="#ffffff" stroke="#6ee7b7"/><text x="98" y="14" class="mono" font-size="11" font-weight="700" fill="#064e3b" text-anchor="middle">Claude</text>
        <rect x="136" y="0" width="60" height="20" rx="6" fill="#ffffff" stroke="#6ee7b7"/><text x="166" y="14" class="mono" font-size="11" font-weight="700" fill="#064e3b" text-anchor="middle">Aiden</text>
        <rect x="202" y="0" width="62" height="20" rx="6" fill="#ffffff" stroke="#6ee7b7"/><text x="233" y="14" class="mono" font-size="11" font-weight="700" fill="#064e3b" text-anchor="middle">Codex</text>
        <rect x="270" y="0" width="66" height="20" rx="6" fill="#ffffff" stroke="#6ee7b7"/><text x="303" y="14" class="mono" font-size="11" font-weight="700" fill="#064e3b" text-anchor="middle">Gemini</text>
        <rect x="342" y="0" width="60" height="20" rx="6" fill="#ffffff" stroke="#6ee7b7"/><text x="372" y="14" class="mono" font-size="11" font-weight="700" fill="#064e3b" text-anchor="middle">Traex</text>
        <rect x="408" y="0" width="56" height="20" rx="6" fill="#ffffff" stroke="#6ee7b7"/><text x="436" y="14" class="mono" font-size="11" font-weight="700" fill="#064e3b" text-anchor="middle">Grok</text>
        <rect x="470" y="0" width="52" height="20" rx="6" fill="#ffffff" stroke="#6ee7b7"/><text x="496" y="14" class="mono" font-size="11" font-weight="700" fill="#064e3b" text-anchor="middle">DSH</text>
        <rect x="528" y="0" width="52" height="20" rx="6" fill="#ffffff" stroke="#6ee7b7"/><text x="554" y="14" class="mono" font-size="11" font-weight="700" fill="#064e3b" text-anchor="middle">AGY</text>
      </g>

      <!-- Row 2: 2 hidden CLI bridges + features -->
      <g transform="translate(14, 53)">
        <rect x="0" y="0" width="76" height="18" rx="5" fill="#d1fae5" stroke="#6ee7b7"/><text x="38" y="12.5" class="mono" font-size="10" font-weight="600" fill="#065f46" text-anchor="middle">claude_w</text>
        <rect x="82" y="0" width="76" height="18" rx="5" fill="#d1fae5" stroke="#6ee7b7"/><text x="120" y="12.5" class="mono" font-size="10" font-weight="600" fill="#065f46" text-anchor="middle">codex_w</text>
        <text x="170" y="13" class="sans" font-size="10.5" fill="#047857">Model/Effort Cascade · Native / Pass-Through · /usage &amp; /settings</text>
      </g>
    </g>

    <!-- Middle Subpanel: Host Shell -->
    <g transform="translate(672, 36)">
      <rect x="0" y="0" width="210" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="22" class="sans" font-size="12.5" font-weight="700" fill="#0f172a">Host Shell</text>
      <rect x="148" y="9" width="48" height="17" rx="8.5" fill="#e2e8f0"/>
      <text x="172" y="21" class="mono" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">/sh</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#475569">Smart 自由文本或 /sh 直通</text>
      <text x="14" y="62" class="mono" font-size="10" fill="#64748b">Direct Host · Redacted Logs</text>
    </g>

    <!-- Right Subpanel: Generation-Fenced Restart -->
    <g transform="translate(898, 36)">
      <rect x="0" y="0" width="214" height="78" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="14" y="22" class="sans" font-size="12.5" font-weight="700" fill="#78350f">Safe Remote Restart</text>
      <text x="14" y="44" class="mono" font-size="11.5" font-weight="700" fill="#b45309">./restart.sh rr</text>
      <text x="14" y="62" class="sans" font-size="10.5" fill="#92400e">Generation Gate · Drain · PID Check</text>
    </g>
  </g>
</svg>
