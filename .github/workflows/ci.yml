name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Validate & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Validate configuration
        run: APP_ID=ci_dummy APP_SECRET=ci_dummy uv run python -m src.main --validate

      - name: Run Ruff lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Check test inventory
        run: uv run python scripts/test_inventory.py tests/

      - name: Build wheel and sdist
        run: uv build

      - name: Run fast test suite
        run: uv run python -m pytest tests/ -q -m "not slow"
