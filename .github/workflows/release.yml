name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1). Leave empty to build and verify artifacts without publishing a release."
        required: false
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Build wheel and sdist
        run: uv build

      - name: Copy installer script to dist
        run: |
          if [ -f install.sh ]; then
            cp install.sh dist/install.sh
            chmod +x dist/install.sh
          fi

      - name: Verify wheel installation
        run: |
          uv tool install --force dist/*.whl
          TOOL_BIN="$(uv tool dir --bin)"
          export PATH="${TOOL_BIN}:$PATH"
          ghostap --version
          (
            cd /tmp
            APP_ID=ci_dummy APP_SECRET=ci_dummy "${TOOL_BIN}/ghostap" --validate
          )

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          files=()
          for f in *.whl *.tar.gz install.sh; do
            if [ -f "$f" ]; then
              files+=("$f")
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found in dist/" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease || (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')) || (inputs.tag != '' && contains(inputs.tag, '-')) }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.whl dist/*.tar.gz dist/install.sh dist/SHA256SUMS.txt)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found in dist/" >&2
            exit 1
          fi

          prerelease_flag=()
          if [ "${IS_PRERELEASE}" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi

          backoffs=(3 5 8 12 18 25 35 0)
          attempt=1
          max_attempts="${#backoffs[@]}"
          for delay in "${backoffs[@]}"; do
            echo "Attempt ${attempt}/${max_attempts}: publishing GitHub Release ${RELEASE_TAG}..."
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              if gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber; then
                echo "Uploaded assets to existing release ${RELEASE_TAG}."
                exit 0
              fi
            else
              if gh release create "${RELEASE_TAG}" \
                --title "${RELEASE_TAG}" \
                --generate-notes \
                "${prerelease_flag[@]}" \
                "${assets[@]}"; then
                echo "Created release ${RELEASE_TAG} with assets."
                exit 0
              fi
            fi

            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "Failed to publish GitHub Release ${RELEASE_TAG} after ${max_attempts} attempts." >&2
              exit 1
            fi
            echo "Transient error publishing release; retrying in ${delay}s..." >&2
            sleep "${delay}"
            attempt=$((attempt + 1))
          done
